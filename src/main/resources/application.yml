spring:
  datasource:
    url: jdbc:mysql://localhost:3306/knowrag_db
    username: {your_username_add}
    password: {your_password_add}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

  cache:
    type: redis

  data:
    redis:
      host: localhost
      port: 6379

ai:
  provider: ollama

openai:
  api-key: ${OPENAI_API_KEY:}
  model: gpt-4.1-mini

logging:
  level:
    com.ai.knowRAG: INFO